name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,all]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy agentmesh

  test:
    name: Tests (py${{ matrix.python }}${{ matrix.extras && ', core only' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        include:
          # Prove a bare install still works: optional extras must stay optional.
          - python: "3.12"
            extras: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          if [ "${{ matrix.extras }}" = "core" ]; then
            pip install -e ".[dev]"
          else
            pip install -e ".[dev,all]"
          fi
      - name: Tests
        run: pytest -q
      - name: Smoke the CLI offline
        run: |
          agentmesh --version
          agentmesh validate-spec --project data_ops
          agentmesh run --project data_ops "Review this SQL query" --provider mock
