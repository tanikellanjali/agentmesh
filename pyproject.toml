[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh"
version = "0.1.0"
description = "Spec-driven open-source agent mesh runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7,<14",
  "typer>=0.12",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = [
  "anthropic>=0.40",
]
openai = [
  "openai>=1.40",
]
providers = [
  "anthropic>=0.40",
  "openai>=1.40",
]
langgraph = [
  "langgraph>=1.0",
]
mcp = [
  "mcp>=1.9",
]
duckdb = [
  "duckdb>=1.0",
]
sql = [
  "sqlalchemy>=2.0",
]
all = [
  "anthropic>=0.40",
  "openai>=1.40",
  "langgraph>=1.0",
  "mcp>=1.9",
  "duckdb>=1.0",
  "sqlalchemy>=2.0",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
agentmesh = "agentmesh.cli.main:app"

[tool.setuptools.packages.find]
include = ["agentmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends()/Header() in defaults is the documented pattern
  "RUF012",  # mutable class attrs; pydantic models handle this themselves
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
