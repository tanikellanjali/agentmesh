id: data_quality_agent
name: Data Quality Agent
category: data_ops
description: >
  Identifies missing values, duplicate records, type mismatches, outliers,
  constraint violations, and data readiness risks.
capabilities:
  - data_quality_check
  - anomaly_detection
input_contract:
  required:
    - detected_schema
  optional:
    - sample_rows
    - quality_rules
output_contract:
  format: json
  required_fields:
    - quality_findings
    - severity
    - recommendations
    - confidence
models:
  default: anthropic/claude-opus-5
  fallback:
    - openai/gpt-4.1-mini
tools:
  - profile_csv
fallback_agents: []
troubleshooting:
  enabled: true
  agent: troubleshooting_agent
validation:
  strict_json: true
  confidence_threshold: 0.72
