# Routing keys are stable names used by agent specs. The `model` field holds the
# provider's actual model id, so an id can move without editing every agent.
models:
  anthropic/claude-opus-5:
    provider: anthropic
    model: claude-opus-5
    cost_per_1k_input_tokens: 0.005
    cost_per_1k_output_tokens: 0.025
    max_tokens: 4096
  anthropic/claude-sonnet-5:
    provider: anthropic
    model: claude-sonnet-5
    cost_per_1k_input_tokens: 0.002
    cost_per_1k_output_tokens: 0.010
    max_tokens: 4096
  anthropic/claude-haiku-4-5:
    provider: anthropic
    model: claude-haiku-4-5
    cost_per_1k_input_tokens: 0.001
    cost_per_1k_output_tokens: 0.005
    max_tokens: 4096
  # Verify OpenAI model ids and pricing against the current OpenAI price list.
  openai/gpt-4.1-mini:
    provider: openai
    model: gpt-4.1-mini
    cost_per_1k_input_tokens: 0.0004
    cost_per_1k_output_tokens: 0.0016
    max_tokens: 4096
  mock/deterministic:
    provider: mock
    model: deterministic
    cost_per_1k_input_tokens: 0
    cost_per_1k_output_tokens: 0
routing_rules:
  default: anthropic/claude-opus-5
  offline: mock/deterministic
  use_heavy_when:
    - reasoning_required
    - validation_failed
    - confidence_below_threshold
